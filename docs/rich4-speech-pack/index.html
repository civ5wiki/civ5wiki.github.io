<title>大富翁4 · 角色语音素材库</title>
<style>
  :root{
    --bg:#14161c; --panel:#1d212b; --panel2:#242a36; --line:#333a49;
    --text:#e8eaf0; --dim:#9aa3b5; --gold:#e8b44a; --red:#e06c75; --blue:#61afef;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Microsoft JhengHei","PingFang TC","Noto Sans CJK TC",system-ui,sans-serif}
  header{padding:28px 22px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#20242e,#14161c)}
  h1{margin:0;font-size:22px;letter-spacing:1px}
  h1 span{color:var(--gold)}
  .sub{margin:6px 0 0;color:var(--dim)}
  .sub b{color:var(--text)}
  .note{margin:8px 0 0;color:#c9a86a;font-size:12px}
  .chars{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px 22px}
  .char{width:80px;flex:0 0 80px;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 3px;cursor:pointer;color:inherit;text-align:center;transition:.15s}
  .char:hover,.char.on{border-color:var(--gold);background:var(--panel2)}
  .char .avatar{width:60px;height:48px;object-fit:contain;flex:0 0 auto;image-rendering:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
  .char .cname{font-weight:700;font-size:12px;line-height:1.2;white-space:nowrap}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 22px;position:sticky;top:0;background:rgba(20,22,28,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);z-index:5}
  .toolbar input[type=search],.toolbar select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit;outline:none}
  .toolbar input[type=search]{min-width:280px;flex:1 1 280px}
  .toolbar select{cursor:pointer}
  .toolbar label{color:var(--dim);font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer}
  .toolbar button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer}
  .toolbar button:hover{border-color:var(--gold)}
  #count{color:var(--dim);font-size:12px;margin-left:auto}
  .table-wrap{padding:0 22px 30px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{background:var(--panel2);color:var(--dim);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody tr{border-bottom:1px solid #252b36;cursor:pointer}
  tbody tr:hover{background:#202634}
  tbody tr.playing{background:#2a2418}
  tbody td{padding:6px 8px;vertical-align:middle}
  td.text{max-width:520px}
  td.text .nl{color:var(--dim)}
  .vid{width:56px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .playcell{width:52px;text-align:right;white-space:nowrap}
  thead th:last-child{text-align:right}
  .tiny{width:26px;height:22px;object-fit:contain;image-rendering:pixelated;vertical-align:middle}
  .play{background:none;border:1px solid var(--line);color:var(--gold);border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:11px;line-height:1}
  .play:hover{border-color:var(--gold);background:#2a2418}
  .badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:#2b3242;color:var(--dim)}
  .badge.m0{background:#2c3a2c;color:#9ccc7a}.badge.m1{background:#3d2a2a;color:#e08a8a}
  .badge.m2{background:#293245;color:#84a9d8}.badge.m3{background:#3a3324;color:#e8c46a}
  .badge.na{background:#2a2d35;color:#777}
  .icon{width:30px;height:24px;object-fit:contain;image-rendering:auto;vertical-align:middle;margin-right:5px}
  .card .line .icon{display:block;width:auto;max-width:100%;height:160px;margin:0 0 8px}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
  #modal.hidden{display:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:760px;width:100%;padding:20px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:calc(100vh - 36px);overflow:auto}
  .card .close{position:absolute;right:12px;top:8px;background:none;border:none;color:var(--dim);font-size:26px;cursor:pointer}
  .card h2{margin:0 0 4px;font-size:18px}
  .card .meta{color:var(--dim);font-size:12px;margin-bottom:12px}
  .card .body{display:flex;gap:18px;align-items:flex-start}
  .card .art{flex:0 0 190px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .card .art img{width:180px;height:auto;image-rendering:auto;background:#0e1015;border-radius:10px;border:1px solid var(--line)}
  .card .art .orig{font-size:11px;color:var(--dim);text-align:center}
  .card .info{flex:1;min-width:0}
  .card .line{font-size:20px;line-height:1.7;margin:4px 0 12px;word-break:break-word}
  audio{width:100%;margin:8px 0}
  .card .path{font:12px/1.5 Consolas,monospace;color:var(--dim);word-break:break-all;margin:4px 0}
  .card .copy{background:#2b3242;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer}
  .card .copy:hover{border-color:var(--gold)}
  footer{padding:10px 22px 40px;color:#6f7788;font-size:11px}
  @media(max-width:720px){.card .body{flex-direction:column}.card .art{flex-direction:row;flex-wrap:wrap}.card .art img{width:120px}}
</style>
</head>

ull,"tool_name":"","used":true,"raw_text":"#0424@07","audio":"audio/tool/11_金貝貝/0424_图标07.opus","portrait":"portrait/11_金貝貝/mood1_生气.webp","character_index":11,"mood_name":"生气","text_inline":"","pictogram_file":"pictogram/p07_问号.webp","pictogram_name":"问号","category_name":"道具"},{"id":1140,"category":"tool","character":"金貝貝","voice":425,"mood":2,"text":"","pictogram":2,"slot":16,"context":"捡到定时炸弹","tool_id":null,"tool_name":"","used":true,"raw_text":"#0425@02","audio":"audio/tool/11_金貝貝/0425_图标02.opus","portrait":"portrait/11_金貝貝/mood2_难过.webp","character_index":11,"mood_name":"难过","text_inline":"","pictogram_file":"pictogram/p02_水滴.webp","pictogram_name":"水滴","category_name":"道具"}]};
const recs = DATA.records;
const chars = DATA.characters;
const picts = DATA.pictograms;
const byId = new Map(recs.map(r => [r.id, r]));
const tbody = document.getElementById('tbody');
const $ = id => document.getElementById(id);

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function enc(p){ return encodeURI(p).replace(/#/g, '%23'); }
function moodName(r){ return r.mood === null || r.mood === undefined || r.mood === '' ? '无' : ['平静','生气','难过','开心'][r.mood]; }
function catName(c){ return {event:'事件', card:'卡片', tool:'道具'}[c] || c; }
function fullText(r){
  if (r.pictogram) return '［图标 ' + String(r.pictogram).padStart(2,'0') + '］';
  return r.text;
}
function lineHTML(r){
  if (r.pictogram){
    return '<img class="icon" src="' + enc(pictogramFor(r)) + '" alt="">图标 ' + String(r.pictogram).padStart(2,'0');
  }
  return esc(r.text).replace(/\n/g, '<br>');
}
function moodBadge(r){
  if (r.mood === null || r.mood === undefined || r.mood === '') return '<span class="badge na">无</span>';
  return '<span class="badge m' + r.mood + '">' + moodName(r) + '</span>';
}
function pictogramFor(r){
  return r.pictogram_file ? r.pictogram_file.replace(/\.webp$/, '_8x.webp') : '';
}
function artFor(r){
  return r.portrait ? r.portrait.replace(/\.webp$/, '_8x.webp') : '';
}

// character overview: the large face the original shows in the money/status panel
$('chars').innerHTML = chars.map(c =>
  '<button class="char" data-c="' + c.index + '" title="' + esc(c.name) + '">' +
  '<img class="avatar" src="' + enc(c.face_large.file) + '" alt="' + esc(c.name) + '">' +
  '<div class="cname">' + esc(c.name) + '</div></button>'
).join('');

// filters
$('f-char').innerHTML = '<option value="">全部角色</option>' + chars.map(c => '<option value="' + c.index + '">' + esc(c.name) + '</option>').join('');
$('total').textContent = recs.length;

function currentFilter(){
  return {
    q: $('q').value.trim().toLowerCase(),
    c: $('f-char').value,
    cat: $('f-cat').value,
    mood: $('f-mood').value,
    used: $('f-used').checked,
  };
}
function match(r, f){
  if (f.c !== '' && String(r.character_index) !== f.c) return false;
  if (f.cat && r.category !== f.cat) return false;
  if (f.mood === 'none'){ if (r.mood !== null && r.mood !== '') return false; }
  else if (f.mood !== '' && String(r.mood) !== f.mood) return false;
  if (f.used && !r.used) return false;
  if (f.q){
    const pictogramTerms = r.pictogram ? [
      '图标' + r.pictogram,
      '图标' + String(r.pictogram).padStart(2, '0'),
      '图标 ' + r.pictogram,
      '图标 ' + String(r.pictogram).padStart(2, '0'),
      r.pictogram_name,
    ].join(' ') : '';
    const hay = [r.text, r.context, r.character, r.card_name, r.tool_name, r.voice, pictogramTerms].join(' ').toLowerCase();
    if (!hay.includes(f.q)) return false;
  }
  return true;
}
function render(){
  const f = currentFilter();
  document.querySelectorAll('.char').forEach(el => {
    const selected = el.dataset.c === f.c;
    el.classList.toggle('on', selected);
    el.setAttribute('aria-pressed', String(selected));
  });
  const rows = recs.filter(r => match(r, f));
  $('count').textContent = '显示 ' + rows.length + ' / ' + recs.length + ' 条';
  const html = rows.map(r => {
    const portrait = r.portrait ? '<img class="tiny" src="' + enc(r.portrait) + '" alt=""> ' : '';
    return '<tr data-id="' + r.id + '">' +
      '<td class="vid">' + r.voice + '</td>' +
      '<td>' + portrait + esc(r.character) + '</td>' +
      '<td>' + moodBadge(r) + '</td>' +
      '<td class="text">' + lineHTML(r) + '</td>' +
      '<td>' + catName(r.category) + '</td>' +
      '<td>' + esc(r.context) + '</td>' +
      '<td class="playcell"><button class="play" data-play="' + r.id + '" title="播放">▶</button></td></tr>';
  }).join('');
  tbody.innerHTML = html;
}
['q','f-char','f-cat','f-mood','f-used'].forEach(id => $(id).addEventListener('input', render));
$('reset').onclick = () => { $('q').value=''; $('f-char').value=''; $('f-cat').value=''; $('f-mood').value=''; $('f-used').checked=false; render(); };
document.querySelectorAll('.char').forEach(el => el.onclick = () => {
  $('f-char').value = el.dataset.c; render();
});

let audio = new Audio();
audio.preload = 'none';
let playingId = null;
function playRec(r){
  audio.src = enc(r.audio);
  audio.play().catch(()=>{});
  $('m-audio').pause();
  playingId = r.id;
  document.querySelectorAll('tr.playing').forEach(tr => tr.classList.remove('playing'));
  const tr = document.querySelector('tr[data-id="' + r.id + '"]');
  if (tr) tr.classList.add('playing');
}
tbody.addEventListener('click', e => {
  const btn = e.target.closest('[data-play]');
  if (btn){ e.stopPropagation(); const r = byId.get(Number(btn.dataset.play)); if (r) playRec(r); return; }
  const tr = e.target.closest('tr');
  if (tr) openModal(byId.get(Number(tr.dataset.id)));
});
function openModal(r){
  if (!r) return;
  audio.pause();
  $('modal').classList.remove('hidden');
  $('m-title').textContent = r.character + ' · ' + catName(r.category);
  $('m-meta').textContent = '编号 ' + r.voice + ' · 情绪 ' + moodName(r) + ' · ' + r.context + (r.used ? '' : ' · 原版未使用');
  const art = artFor(r);
  if (art){ $('m-art').style.display = ''; $('m-art').src = enc(art); }
  else { $('m-art').style.display = 'none'; $('m-art').removeAttribute('src'); }
  $('m-art').alt = r.character + '（' + moodName(r) + '）';
  $('m-orig').textContent = art ? ('AI 重绘 · 8× · ' + moodName(r)) : '';
  if (r.pictogram){
    $('m-line').innerHTML = '<img class="icon" src="' + enc(pictogramFor(r)) + '" alt="" title="说话图标 ' +
      String(r.pictogram).padStart(2,'0') + '（' + esc(r.pictogram_name || '') + '）">图标 ' +
      String(r.pictogram).padStart(2,'0');
  } else {
    $('m-line').innerHTML = esc(r.text).replace(/\n/g,'<br>');
  }
  $('m-audio').src = enc(r.audio);
  $('m-audio-path').textContent = r.audio;
  $('m-art-path').textContent = (art || '（原版未使用，无情绪头像）') +
    (r.pictogram ? '　|　说话图标（AI 重绘 · 8×）：' + pictogramFor(r) : '');
  $('m-copy').onclick = () => copyText(fullText(r));
  $('m-audio').play().catch(()=>{});
}
function copyText(t){
  const done = () => { const b=$('m-copy'); const old=b.textContent; b.textContent='已复制'; setTimeout(()=>b.textContent=old,1200); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(fallback);
  else fallback();
  function fallback(){
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){}
    document.body.removeChild(ta);
  }
}
$('close').onclick = () => { $('modal').classList.add('hidden'); $('m-audio').pause(); };
$('modal').addEventListener('click', e => { if (e.target === $('modal')){ $('modal').classList.add('hidden'); $('m-audio').pause(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ $('modal').classList.add('hidden'); $('m-audio').pause(); } });

$('footer').textContent = DATA.meta.title + ' · 生成于 ' + DATA.meta.generated_at + ' · ' + DATA.meta.audio.format + ' · ' + recs.length + ' 条';
render();
</script>
